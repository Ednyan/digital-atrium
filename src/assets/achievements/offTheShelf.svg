<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Off the Shelf</title>
  <defs>
    <!-- The light inside the tile, in the family's colour. -->
    <radialGradient id="glow" cx="50%" cy="34%" r="72%">
      <stop offset="0" stop-color="#A8B6D9" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#A8B6D9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A8B6D9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- The tile: dark, its top right corner cut, lit from inside, framed in the family's colour. -->
  <g id="tile">
    <path d="M2 2h48l12 12v48H2z" fill="#111114"/>
    <path d="M2 2h48l12 12v48H2z" fill="url(#glow)"/>
    <path d="M7 7h41l9 9v41H7z" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    <path d="M2 2h48l12 12v48H2z" fill="none" stroke="#A8B6D9" stroke-opacity="0.75" stroke-width="1.5"/>
  </g>
  <!-- The symbol, drawn in line on a 24 grid, placed and scaled onto the tile. -->
  <g id="symbol" transform="translate(14 13) scale(1.5)" fill="none" stroke="#f6f2ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4h16v6H4zM4 14h7v6H4zM14 14h6v6h-6z"/>
  </g>
</svg>
