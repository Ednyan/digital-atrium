<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>One Year</title>
  <defs>
    <!-- The light inside the tile, in the family's colour. -->
    <radialGradient id="glow" cx="50%" cy="34%" r="72%">
      <stop offset="0" stop-color="#9AD4C4" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#9AD4C4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9AD4C4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- The tile: dark, its top right corner cut, lit from inside, framed in the family's colour. -->
  <g id="tile">
    <path d="M2 2h48l12 12v48H2z" fill="#111114"/>
    <path d="M2 2h48l12 12v48H2z" fill="url(#glow)"/>
    <path d="M7 7h41l9 9v41H7z" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    <path d="M2 2h48l12 12v48H2z" fill="none" stroke="#9AD4C4" stroke-opacity="0.75" stroke-width="1.5"/>
  </g>
  <!-- The symbol, drawn in line on a 24 grid, placed and scaled onto the tile. -->
  <g id="symbol" transform="translate(14 9) scale(1.5)" fill="none" stroke="#f6f2ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0M3 12h1.5M19.5 12H21M12 3v1.5M12 19.5V21M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M5.6 18.4l1.1-1.1M17.3 6.7l1.1-1.1"/>
  </g>
  <!-- Its step of the count: one diamond each. -->
  <g id="tier" fill="#9AD4C4">
    <path d="M24.5 51.5l2.6 2.6-2.6 2.6-2.6-2.6z"/>
    <path d="M32 51.5l2.6 2.6-2.6 2.6-2.6-2.6z"/>
    <path d="M39.5 51.5l2.6 2.6-2.6 2.6-2.6-2.6z"/>
  </g>
</svg>
